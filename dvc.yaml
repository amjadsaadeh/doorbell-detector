stages:
  fetch_labeled_data:
    cmd: ./src/fetch_data.sh
    deps:
    - src/fetch_data.sh
    outs:
    - data/labeled_data.csv

  convert_labeled_data:
    cmd: python src/convert_labeled_data.py
    deps:
    - data/labeled_data.csv
    - src/convert_labeled_data.py
    outs:
    - data/annotation_per_row_data.csv

  download_audio:
    cmd: python ./src/download_audio.py --target-dir data/audio --annotations-file
      data/annotation_per_row_data.csv
    deps:
    - data/annotation_per_row_data.csv
    - src/download_audio.py
    outs:
    - data/audio:
        persist: true

  extract_data_quality:
    cmd: python ./src/extract_data_quality.py
    deps:
    - data/annotation_per_row_data.csv
    - src/extract_data_quality.py
    outs:
    - data/data_quality/sample_based_quality.json
    - data/data_quality/samples_per_label.csv

  fetch_noise_esc50:
    cmd: python src/fetch_noise_esc50.py
    deps:
    - src/fetch_noise_esc50.py
    - src/noise_pool.py
    params:
    - noise_pools.esc50
    outs:
    - data/noise/esc50

  fetch_noise_demand:
    cmd: python src/fetch_noise_demand.py
    deps:
    - src/fetch_noise_demand.py
    - src/noise_pool.py
    params:
    - noise_pools.demand
    outs:
    - data/noise/demand

  augmentation:
    cmd: python src/augment_data.py
    deps:
    - data/audio
    - data/noise/esc50
    - data/noise/demand
    - data/annotation_per_row_data.csv
    - src/augment_data.py
    params:
    - chunk_size
    - chunk_overlap
    - augmentation
    outs:
    - data/augmented_audio
    - data/augmented_annotations.csv

  # Which chunks make up the dataset. Deliberately free of any
  # feature_extraction param: every representation trains on the same chunks
  # in the same order, and sweeping features reuses this stage's cache.
  select_chunks:
    cmd: python src/select_chunks.py
    deps:
    - data/annotation_per_row_data.csv
    - data/augmented_annotations.csv
    - data/audio
    - data/augmented_audio
    - data/noise/esc50
    - data/noise/demand
    - src/select_chunks.py
    - src/audio_sources.py
    - src/dataqualityutils.py
    - src/paths.py
    params:
    - chunk_size
    - chunk_overlap
    - inbalance_ratio
    - external_background_ratio
    - augmentation.external_noise_pools
    outs:
    - data/chunk_manifest.csv
    - data/data_quality/chunks_per_label.csv
    - data/data_quality/chunk_balanced_quality.json

  # Downstream of select_chunks, so only the files a chunk references get
  # extracted rather than every wav in every source.
  extract_features:
    cmd: python src/extract_features.py
    deps:
    - data/chunk_manifest.csv
    - data/audio
    - data/augmented_audio
    - data/noise/esc50
    - data/noise/demand
    - src/extract_features.py
    - src/features.py
    - src/audio_sources.py
    - src/paths.py
    params:
    - feature_extraction
    outs:
    - ${feature_extraction.features_dir}

  draw_data:
    cmd: python src/draw_data.py
    deps:
    - data/chunk_manifest.csv
    - ${feature_extraction.features_dir}
    - src/draw_data.py
    - src/features.py
    - src/paths.py
    params:
    - feature_extraction
    outs:
    - data/balanced_data.h5

  train_model:
    cmd: python src/train_model.py
    deps:
    - data/balanced_data.h5
    - data/data_quality/sample_based_quality.json
    - data/data_quality/samples_per_label.csv
    - data/data_quality/chunk_balanced_quality.json
    - data/data_quality/chunks_per_label.csv
    - src/train_model.py
    - src/train_cnn.py
    - src/train_xgboost.py
    - src/features.py
    - src/paths.py
    params:
    - model
    - training
    outs:
    - models/trained

  # In the default DAG so candidates are ranked on their post-quantization
  # score; non-cnn heads write a skip marker instead of a model.
  quantize_model:
    cmd: python src/quantize_model.py
    deps:
    - data/balanced_data.h5
    - data/chunk_manifest.csv
    - models/trained
    - src/quantize_model.py
    - src/tflite_utils.py
    - src/train_cnn.py
    - src/splits.py
    - src/paths.py
    params:
    - quantization.calibration_samples
    - training
    outs:
    - models/export
    - data/calibration

  # Separate stage from the one that produced the model, so what decides
  # whether it ships is not the same code path that built it.
  evaluate_quantized:
    cmd: python src/evaluate_quantized.py
    deps:
    - data/balanced_data.h5
    - models/trained
    - models/export
    - data/calibration
    - src/evaluate_quantized.py
    - src/quantize_model.py
    - src/tflite_utils.py
    - src/train_cnn.py
    - src/train_xgboost.py
    - src/splits.py
    - src/paths.py
    params:
    - quantization
    - training
    metrics:
    - models/quantized_metrics.json:
        cache: false

metrics:
- data/data_quality/sample_based_quality.json
- data/data_quality/chunk_balanced_quality.json
plots:
- number of samples vs label:
    template: bar_horizontal_sorted
    x: '0'
    y:
      data/data_quality/samples_per_label.csv: label
params:
- params.yaml
