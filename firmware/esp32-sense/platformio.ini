; PlatformIO project for the Seeed XIAO ESP32S3 Sense doorbell recorder.
; Secrets are never written here — they flow in from environment variables
; via build.sh (see .env.esp32.example). See firmware/esp32-sense/README.md.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; Flashing through usbipd (WSL2) breaks esptool's stub loader: it stops
; answering after the switch to 460800 baud ("No serial data received"), and
; even at 115200 ("Unable to verify flash chip connection"). The ROM loader at
; 115200 is slower (~10 s for the app) but reliable.
upload_speed = 115200
upload_flags = --no-stub

build_flags =
  -DBOARD_HAS_PSRAM
  '-DWIFI_SSID="${sysenv.ESP32_WIFI_SSID}"'
  '-DWIFI_PASSWORD="${sysenv.ESP32_WIFI_PASSWORD}"'
  '-DMQTT_HOST="${sysenv.ESP32_MQTT_HOST}"'
  -DMQTT_PORT=${sysenv.ESP32_MQTT_PORT}
  '-DMQTT_USERNAME="${sysenv.ESP32_MQTT_USERNAME}"'
  '-DMQTT_PASSWORD="${sysenv.ESP32_MQTT_PASSWORD}"'
  '-DMQTT_TRIGGER_TOPIC="${sysenv.ESP32_MQTT_TRIGGER_TOPIC}"'
  '-DMINIO_ENDPOINT="${sysenv.ESP32_MINIO_ENDPOINT}"'
  '-DMINIO_ACCESS_KEY="${sysenv.ESP32_MINIO_ACCESS_KEY}"'
  '-DMINIO_SECRET_KEY="${sysenv.ESP32_MINIO_SECRET_KEY}"'
  '-DMINIO_BUCKET="${sysenv.ESP32_MINIO_BUCKET}"'
  '-DMINIO_REGION="${sysenv.ESP32_MINIO_REGION}"'
  '-DDEVICE_ID="${sysenv.ESP32_DEVICE_ID}"'
  '-DTZ_STRING="${sysenv.ESP32_TZ}"'
  '-DMINIO_FIRMWARE_PREFIX="${sysenv.ESP32_MINIO_FIRMWARE_PREFIX}"'
  '-DFW_VERSION="${sysenv.ESP32_FW_VERSION}"'

lib_deps =
  knolleary/PubSubClient@^2.8

; Native (host) environment for testing pure logic (sigv4) without hardware.
; lib/sigv4core/ holds the hardware-independent sources (sha256, hmac_sha256,
; sigv4) as a proper PlatformIO library, so the LDF links it into this
; environment automatically — everything else in src/ depends on
; Arduino/ESP32 headers that don't exist for the native platform, and is
; never referenced by test_sigv4, so it's never pulled in.
[env:native]
platform = native
test_filter = test_sigv4
build_flags =
  -std=c++17
